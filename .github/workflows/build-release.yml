name: Build and attach mod JAR

on:
  push:
    branches:
      - 'arena/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Build mod
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon build --stacktrace 2>&1 | tee build-output.log

      - name: Preserve Gradle failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-log
          path: build-output.log
          if-no-files-found: ignore

      - name: Select distributable JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'copper-chest-sorter-*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$jar_path"
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
          ls -lh "$jar_path"

      - name: Upload JAR as branch build artifact
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: copper-chest-sorter-jar
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

      - name: Upload JAR to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" "${{ steps.jar.outputs.path }}" --clobber
